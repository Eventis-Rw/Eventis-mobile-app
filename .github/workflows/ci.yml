name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # This repository stays on pnpm. Its preinstall hook hard-fails on any other
      # package manager, and its workspace carries a catalog plus ~80 platform
      # overrides. See Eventis-contracts ADR 0002.
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Block committed secrets
        run: |
          # This repository is public. A leaked credential is public the moment it lands.
          if git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD 2>/dev/null \
             | grep -E '(^|/)\.env$|\.pem$|\.p8$|\.p12$|\.key$|\.keystore$|\.jks$|google-services\.json$|GoogleService-Info\.plist$'; then
            echo "A secret-shaped file is in this diff. Rotate the credential first, then remove it."
            exit 1
          fi
          echo "No secret-shaped files in the diff."
